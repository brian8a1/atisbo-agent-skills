interface:
  display_name: "Senso Signal Review"
  short_description: "Review and correct captured Signals"
  default_prompt: "Use $signal-review to review the new Signals and surface the decisions that need me."
dependencies:
  tools:
    - type: "mcp"
      value: "senso"
      description: "Senso Signals, Opportunities, Backlog, Decisions, and Outcomes"
      transport: "streamable_http"
      url: "https://app.getsenso.xyz/api/mcp"
policy:
  allow_implicit_invocation: true
