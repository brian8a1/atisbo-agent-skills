interface:
  display_name: "Atisbo Handoff"
  short_description: "Hand a design or PR to human review"
  default_prompt: "Use $handoff to connect this completed artifact to its Atisbo Backlog item and hand it to review."
dependencies:
  tools:
    - type: "mcp"
      value: "atisbo"
      description: "Atisbo Signals, Opportunities, Backlog, Decisions, and Outcomes"
      transport: "streamable_http"
      url: "https://app.atisbo.dev/api/mcp"
policy:
  allow_implicit_invocation: true
