interface:
  display_name: "Atisbo Agent Dispatch"
  short_description: "Hand ready Backlog work to a coding agent"
  default_prompt: "Use $agent-dispatch to show what a coding agent can pick up from my Atisbo Backlog and what still needs me."
dependencies:
  tools:
    - type: "mcp"
      value: "atisbo"
      description: "Atisbo Signals, Opportunities, Backlog, Decisions, and Outcomes"
      transport: "streamable_http"
      url: "https://app.atisbo.dev/api/mcp"
policy:
  allow_implicit_invocation: true
