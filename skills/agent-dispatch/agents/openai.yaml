interface:
  display_name: "Senso Agent Dispatch"
  short_description: "Hand ready Backlog work to a coding agent"
  default_prompt: "Use $agent-dispatch to show what a coding agent can pick up from my Senso Backlog and what still needs me."
dependencies:
  tools:
    - type: "mcp"
      value: "senso"
      description: "Senso Signals, Opportunities, Backlog, Decisions, and Outcomes"
      transport: "streamable_http"
      url: "https://app.getsenso.xyz/api/mcp"
policy:
  allow_implicit_invocation: true
